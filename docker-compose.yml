services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: csroi
      POSTGRES_PASSWORD: csroi
      POSTGRES_DB: csroi
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csroi -d csroi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://csroi:csroi@postgres:5432/csroi
      REDIS_URL: redis://redis:6379/0
      SKINPORT_CURRENCY: USD
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.jobs.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://csroi:csroi@postgres:5432/csroi
      REDIS_URL: redis://redis:6379/0
      SKINPORT_CURRENCY: USD
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
